services:
  postgres:
    image: postgres:15-alpine
    container_name: inventory_postgres
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ../internal/infrastructure/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  inventory_grpc_service:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: inventory_grpc_service
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
